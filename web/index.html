function ToggleSwitch({ checked, onChange, disabled }) {
  return (
    <button
      type="button"
      role="switch"
      aria-checked={checked}
      disabled={disabled}
      onClick={() => onChange(!checked)}
      className={`relative inline-flex h-5 w-9 shrink-0 cursor-pointer items-center rounded-full p-0.5 transition-colors duration-200 focus:outline-none disabled:cursor-not-allowed disabled:opacity-40 ${
        checked ? "bg-primary" : "bg-input"
      }`}
    >
      <motion.span
        initial={false}
        animate={{ x: checked ? 16 : 0 }}
        transition={{ type: "spring", stiffness: 520, damping: 34 }}
        className="pointer-events-none block h-4 w-4 rounded-full bg-white shadow-sm"
      />
    </button>
  );
}

function QuestLogo({ urls, game }) {
  const [idx, setIdx] = useState(0);
  const list = Array.isArray(urls) ? urls.filter(Boolean) : [];
  const initials = (game || "Q").slice(0, 2).toUpperCase();

  useEffect(() => {
    setIdx(0);
  }, [list[0]]);

  if (idx >= list.length) {
    return (
      <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border border-border bg-secondary text-sm font-semibold text-muted-foreground">
        {initials}
      </div>
    );
  }

  return (
    <img
      src={list[idx]}
      alt=""
      onError={() => setIdx((prev) => prev + 1)}
      className="h-12 w-12 shrink-0 rounded-xl border border-border bg-secondary object-cover"
    />
  );
}

function fmtTask(type) {
  const map = {
    WATCH_VIDEO: "Видео",
    WATCH_VIDEO_ON_MOBILE: "Видео (моб.)",
    PLAY_ON_DESKTOP: "Игра на ПК",
    STREAM_ON_DESKTOP: "Стрим в войсе",
    PLAY_ACTIVITY: "Активность",
    ACHIEVEMENT_IN_ACTIVITY: "Достижение",
    ACHIEVEMENT_IN_GAME: "Достижение",
  };
  return map[type] || type;
}

function fmtProgress(done, needed, isStep) {
  if (isStep) return `${done} / ${needed} шагов`;
  const f = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec < 10 ? "0" : ""}${sec}`;
  };
  return `${f(done)} / ${f(needed)}`;
}

function fmtExpires(iso) {
  if (!iso) return "";
  const diff = new Date(iso).getTime() - Date.now();
  if (diff <= 0) return "истёк";
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(h / 24);
  return d > 0 ? `${d}д ${h % 24}ч` : `${h}ч`;
}

function App() {
  const [dark, setDark] = useState(true);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [activeTab, setActiveTab] = useState("active");
  const [sortBy, setSortBy] = useState("smart");
  const [sortMenuOpen, setSortMenuOpen] = useState(false);
  const [search, setSearch] = useState("");
  const [busyId, setBusyId] = useState(null);
  const [mainBusy, setMainBusy] = useState(false);
  const [closeModalOpen, setCloseModalOpen] = useState(false);
  const allowCloseRef = useRef(false);
  const beaconSentRef = useRef(false);

  const [status, setStatus] = useState({
    discordInstalled: true,
    discordRunning: true,
    cdpConnected: false,
    tracker: null,
  });

  useEffect(() => {
    const root = document.documentElement;
    if (dark) root.classList.add("dark");
    else root.classList.remove("dark");
  }, [dark]);

  useEffect(() => {
    window.onbeforeunload = null;

    const onKeyDown = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
        e.preventDefault();
        setSidebarOpen((v) => !v);
      }
      if (e.key === "Escape") {
        setCloseModalOpen(false);
        setSortMenuOpen(false);
      }
    };
    const onClick = () => {
      setSortMenuOpen(false);
    };
    const sendCloseBeacon = () => {
      if (!allowCloseRef.current && !beaconSentRef.current && navigator.sendBeacon) {
        beaconSentRef.current = true;
        navigator.sendBeacon("/api/window-closed");
      }
    };

    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("click", onClick);
    window.addEventListener("pagehide", sendCloseBeacon);
    window.addEventListener("unload", sendCloseBeacon);
    return () => {
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("click", onClick);
      window.removeEventListener("pagehide", sendCloseBeacon);
      window.removeEventListener("unload", sendCloseBeacon);
    };
  }, []);

  const fetchStatus = async () => {
    try {
      const res = await fetch("/api/status");
      const data = await res.json();
      setStatus(data);
    } catch (e) {}
  };

  useEffect(() => {
    fetchStatus();
    const timer = setInterval(fetchStatus, 1800);
    return () => clearInterval(timer);
  }, []);

  const postAction = async (url, payload, toastText, toastType = "info") => {
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload ? JSON.stringify(payload) : undefined,
      });
      if (!res.ok) {
        const errTxt = await res.text();
        toast.error(errTxt || "Ошибка выполнения");
        return;
      }
      const data = await res.json();
      if (data.tracker) {
        setStatus((prev) => ({ ...prev, cdpConnected: true, tracker: data.tracker }));
      } else {
        await fetchStatus();
      }
      if (toastText && toast[toastType]) {
        toast[toastType](toastText);
      }
    } catch (e) {
      toast.error("Нет связи с сервером");
    }
  };

  const tracker = status.tracker;
  const quests = tracker?.quests || [];
  const isRunning = Boolean(tracker?.isRunning);
  const orbBalance = typeof tracker?.orbBalance === "number" ? tracker.orbBalance : 0;
  const hasBalance = typeof tracker?.orbBalance === "number";
  const earnedOrbs = tracker?.earnedOrbs || 0;

  const stats = useMemo(() => {
    const active = quests.filter((q) => !q.completed);
    const done = quests.filter((q) => q.completed);
    const orbs = quests.filter((q) => (q.reward?.orbs || 0) > 0);
    const availOrbs = active.reduce((s, q) => s + (q.reward?.orbs || 0), 0);
    const remSec = active
      .filter((q) => q.supported && !q.isStepTask)
      .reduce((s, q) => s + Math.max(0, q.secondsNeeded - q.secondsDone), 0);
    return {
      total: quests.length,
      activeCount: active.length,
      doneCount: done.length,
      orbsCount: orbs.length,
      availOrbs,
      remMinutes: Math.ceil(remSec / 60),
    };
  }, [quests]);

  const filteredQuests = useMemo(() => {
    let list = quests;
    if (activeTab === "active") list = quests.filter((q) => !q.completed);
    else if (activeTab === "orbs") list = quests.filter((q) => (q.reward?.orbs || 0) > 0);
    else if (activeTab === "done") list = quests.filter((q) => q.completed);

    const qStr = search.trim().toLowerCase();
    if (qStr) {
      list = list.filter(
        (q) =>
          (q.name || "").toLowerCase().includes(qStr) ||
          (q.game || "").toLowerCase().includes(qStr)
      );
    }

    const copy = [...list];
    copy.sort((a, b) => {
      if (sortBy === "orbs") {
        const diff = (b.reward?.orbs || 0) - (a.reward?.orbs || 0);
        if (diff !== 0) return diff;
      } else if (sortBy === "fast") {
        const rA = a.completed ? 9999999 : a.secondsNeeded - a.secondsDone;
        const rB = b.completed ? 9999999 : b.secondsNeeded - b.secondsDone;
        if (rA !== rB) return rA - rB;
      } else if (sortBy === "expiring") {

        if (!q.completed && q.supported && !q.enrolled) return 2;
        if (!q.completed && !q.supported) return 3;
        return 4;
      };
      const rk = rank(a) - rank(b);
      if (rk !== 0) return rk;
      return b.percent - a.percent;
    });

                            ? "text-emerald-400"
                            : l.level === "run"
                            ? "text-indigo-400"
                            : l.level === "warn"
                            ? "text-amber-400"
                            : l.level === "err"
                            ? "text-red-400"
                            : "text-foreground"
                        }
                      >
                        {l.text}
                      </span>
                    </div>
                  ))
                )}
              </div>
            </div>
          ) : (
            <LayoutGroup>
              <motion.div
                layout
                className="grid min-h-0 flex-1 grid-cols-1 content-start gap-4 overflow-y-auto pr-1 lg:grid-cols-2 2xl:grid-cols-3"
              >
                <AnimatePresence mode="popLayout">
                  {filteredQuests.length === 0 ? (
                    <motion.div
                      key="empty"
                      initial={{ opacity: 0 }}
                      animate={{ opacity: 1 }}
                      exit={{ opacity: 0 }}
                      className="col-span-full flex flex-col items-center justify-center rounded-2xl border border-dashed border-border p-14 text-center"
                    >
                      <p className="text-sm font-semibold text-foreground">Задания не найдены</p>
                      <p className="mt-1 text-xs text-muted-foreground">
                        Выбери другой раздел слева или нажми «Принять все»
                      </p>
                    </motion.div>
                  ) : (
                    filteredQuests.map((q) => {
                      const isThisRunning = tracker?.currentQuestId === q.id && isRunning;
                      return (
                        <motion.div
                          key={q.id}
                          layout="position"
                          initial={{ opacity: 0, scale: 0.96, y: 8 }}
                          animate={{ opacity: 1, scale: 1, y: 0 }}
                          exit={{ opacity: 0, scale: 0.95, transition: { duration: 0.14 } }}
                          transition={{
                            layout: { type: "spring", stiffness: 360, damping: 32, mass: 0.85 },
                            opacity: { duration: 0.2 },
                            scale: { duration: 0.2 },
                          }}
                          className={`flex flex-col justify-between gap-4 rounded-2xl border bg-card p-5 transition-colors ${
                            isThisRunning
                              ? "border-primary ring-1 ring-primary/40"
                              : "border-border hover:border-foreground/20"
                          } ${q.completed ? "opacity-65" : ""}`}
                        >
                          <div className="flex items-start gap-3.5">
                            <QuestLogo urls={q.imageUrls} game={q.game} />
                            <div className="min-w-0 flex-1">
                              <h3 className="truncate text-[14.5px] font-semibold leading-snug" title={q.name}>
                                {q.name}
                              </h3>
                              <p className="mt-1 truncate text-xs text-muted-foreground">
                                {q.game} • {fmtTask(q.taskType)} • {fmtExpires(q.expiresAt)}
                              </p>
                            </div>
                          </div>

                          <div className="flex flex-wrap items-center justify-between gap-2">
                            {q.completed ? (
                              <span className="inline-flex items-center rounded-lg bg-emerald-500/15 px-2.5 py-1 text-xs font-semibold text-emerald-400">
                                Выполнено
                              </span>
                            ) : isThisRunning ? (
                              <span className="inline-flex items-center gap-1.5 rounded-lg bg-primary/15 px-2.5 py-1 text-xs font-semibold text-primary">
                                <span className="h-1.5 w-1.5 rounded-full bg-primary animate-ping" />
                                Выполняется
                              </span>
                            ) : q.isExternal ? (
                              <span className="inline-flex items-center rounded-lg bg-amber-500/15 px-2.5 py-1 text-xs font-semibold text-amber-400">
                                Вручную в активности
                              </span>
                            ) : !q.supported ? (
                              <span className="inline-flex items-center rounded-lg bg-destructive/15 px-2.5 py-1 text-xs font-semibold text-destructive">
                                Не поддерживается
                              </span>
                            ) : q.enrolled ? (
                              <span className="inline-flex items-center rounded-lg bg-secondary px-2.5 py-1 text-xs font-medium text-secondary-foreground">
                                Принят
                              </span>
                            ) : q.enrollFailed ? (
                              <span className="inline-flex items-center rounded-lg bg-destructive/15 px-2.5 py-1 text-xs font-semibold text-destructive">
                                Недоступен в регионе
                              </span>
                            ) : (
                              <span className="inline-flex items-center rounded-lg border border-border px-2.5 py-1 text-xs font-medium text-muted-foreground">
                                Новый
                              </span>
                            )}

                            {(q.reward?.orbs || 0) > 0 ? (
                              <span className="inline-flex items-center gap-1 rounded-lg border border-violet-500/30 bg-violet-500/15 px-2.5 py-1 font-mono text-xs font-semibold text-violet-300">
                                +{q.reward.orbs} Orbs
                              </span>
                            ) : (
                              <span className="max-w-[160px] truncate rounded-lg border border-border px-2.5 py-1 text-xs font-medium text-muted-foreground">
                                {q.reward?.name}
                              </span>
                            )}
                          </div>

                          <div className="flex items-center gap-3.5 pt-0.5">
                            <div className="min-w-0 flex-1">
                              <div className="h-2 w-full overflow-hidden rounded-full bg-secondary">
                                <motion.div
                                  initial={false}
                                  animate={{ width: `${Math.min(100, Math.max(0, q.percent))}%` }}
                                  transition={{ type: "spring", stiffness: 200, damping: 28 }}
                                  className={`h-full rounded-full ${
                                    q.completed ? "bg-emerald-500" : "bg-primary"
                                  }`}
                                />
                              </div>
                              <div className="mt-1.5 flex justify-between font-mono text-[11px] font-medium text-muted-foreground tabular-nums">
                                <span>{fmtProgress(q.secondsDone, q.secondsNeeded, q.isStepTask)}</span>
                                <span>{q.percent}%</span>
                              </div>
                            </div>

                            {!q.completed && q.supported && (
                              isThisRunning ? (
                                <button
                                  type="button"
                                  onClick={handleStop}
                                  className="inline-flex h-8 w-[96px] shrink-0 items-center justify-center rounded-xl bg-destructive px-3 text-xs font-semibold text-destructive-foreground hover:opacity-90 transition-opacity"
                                >
                                  Стоп
                                </button>
                              ) : (
                                <button
                                  type="button"
                                  disabled={busyId === q.id}
                                  onClick={() => handleStartOne(q)}
                                  className="inline-flex h-8 w-[96px] shrink-0 items-center justify-center rounded-xl border border-input bg-secondary/70 px-3 text-xs font-semibold text-foreground hover:bg-primary hover:text-primary-foreground hover:border-primary disabled:opacity-50 transition-colors"
                                >
                                  {busyId === q.id ? "..." : "Запустить"}
                                </button>
                              )
                            )}
                          </div>
                        </motion.div>
                      );
                    })
                  )}
                </AnimatePresence>
              </motion.div>
            </LayoutGroup>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
